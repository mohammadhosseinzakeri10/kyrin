name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/local-data/pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.4'
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libopengl0 ffmpeg gjs dbus-daemon systemd
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements/bootstrap.txt
          python -m pip install -r requirements/core.txt -r requirements/dev.txt -r requirements/test-ui.txt
          python -m pip install --no-build-isolation --no-deps -e '.[dev]'
          python -m pip check
      - name: Record installed versions
        run: |
          mkdir -p local-data/quality
          python --version > local-data/quality/python.txt
          python -m pip freeze --all > local-data/quality/installed.txt
      - name: Syntax, lint, strict types and deterministic tests
        run: python scripts/development/check.py
      - name: Build source and wheel distributions
        run: |
          python -c "from setuptools.build_meta import build_sdist, build_wheel; build_sdist('dist'); build_wheel('dist')"
          python -m venv local-data/package-smoke
          local-data/package-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd local-data
          package-smoke/bin/python -c "from importlib.metadata import version; from importlib.resources import files; assert version('kyrin') == '0.1.0'; assert files('kyrin.audio.activity.models').joinpath('silero_vad.onnx').is_file(); assert files('kyrin.app.qt').joinpath('assets/kyrin-logo.png').is_file()"
      - name: Retain every check result, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-quality
          path: local-data/quality/
          retention-days: 7
      - name: Retain source and wheel distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
