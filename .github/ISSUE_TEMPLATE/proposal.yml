name: Focused proposal
description: Discuss an improvement to the public snapshot before implementation.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        This repository publishes the v0.1.0 portfolio snapshot. Future private releases
        are outside its scope. Small fixes and evidence-backed design feedback are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What concrete limitation of the published snapshot does this address?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change and alternatives
      description: Explain affected boundaries, new dependencies and simpler alternatives.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and limits
      description: How would the change be tested without personal data or desktop access?
