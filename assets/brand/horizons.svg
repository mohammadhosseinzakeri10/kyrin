<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">The KYRIN horizon</title>
  <desc id="desc">Three planned directions for KYRIN: voice, vision, and desktop action.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="218" rx="18" fill="url(#bg)" stroke="#203044"/>
  <path d="M400 40V180M800 40V180" stroke="#233047"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(36 32)">
      <text y="15" fill="#7c99b5" font-size="12" letter-spacing="2">01 / VOICE</text>
      <g transform="translate(0 38)" stroke="#80ddf5" stroke-width="2.5" stroke-linecap="round"><path d="M3 15v8M11 7v24M19 0v38M27 11v16M35 5v28M43 14v10"/></g>
      <text y="112" fill="#edf6ff" font-size="24" font-weight="600">A natural starting point.</text>
      <text y="143" fill="#9daec3" font-size="16">Building the foundation for voice input.</text>
    </g>
    <g transform="translate(436 32)">
      <text y="15" fill="#7c99b5" font-size="12" letter-spacing="2">02 / VISION</text>
      <g transform="translate(0 41)" stroke="#98befd" stroke-width="2" fill="none"><path d="M0 16Q24 -10 48 16Q24 42 0 16Z"/><circle cx="24" cy="16" r="7"/></g>
      <text y="112" fill="#edf6ff" font-size="24" font-weight="600">Context beyond words.</text>
      <text y="143" fill="#9daec3" font-size="16">A future direction for visual awareness.</text>
    </g>
    <g transform="translate(836 32)">
      <text y="15" fill="#7c99b5" font-size="12" letter-spacing="2">03 / ACTION</text>
      <g transform="translate(3 40)" stroke="#aaa6fd" stroke-width="2" fill="none" stroke-linejoin="round"><path d="M1 0L34 23 20 25 13 39Z"/><path d="M33 1h12M39 -5v12"/></g>
      <text y="112" fill="#edf6ff" font-size="24" font-weight="600">Intent into interaction.</text>
      <text y="143" fill="#9daec3" font-size="16">Toward meaningful desktop assistance.</text>
    </g>
  </g>
</svg>
